name: fixinh-local

services:
  smt-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixinh_smt
      POSTGRES_USER: fixinh
      POSTGRES_PASSWORD: fixinh-dev
    volumes:
      - smt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixinh -d fixinh_smt"]
      interval: 5s
      timeout: 5s
      retries: 20

  smt-api:
    build:
      # Override SMT_REPO_PATH if the separate SMT checkout lives elsewhere.
      context: ${SMT_REPO_PATH:-../../../ServiceManagementPortal}
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: smt-postgres
      DB_PORT: 5432
      POSTGRES_DB: fixinh_smt
      POSTGRES_USER: fixinh
      POSTGRES_PASSWORD: fixinh-dev
      SMP_SERVICE_TOKEN: local-integration-token
    ports:
      - "9443:9443"
    depends_on:
      smt-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9443/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo-north:
    image: mongo:7.0
    volumes:
      - sbp-mongo-north-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-south:
    image: mongo:7.0
    volumes:
      - sbp-mongo-south-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  sbp-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./Backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8443
      MONGO_URI_NORTH: mongodb://mongo-north:27017/sbp_north
      MONGO_URI_SOUTH: mongodb://mongo-south:27017/sbp_south
      MONGO_SERVER_SELECTION_TIMEOUT_SECONDS: 10
      JWT_SECRET: docker-local-only-jwt-secret-at-least-32-bytes
      JWT_ISSUER: fixinh-sbp
      JWT_ACCESS_TOKEN_TTL_MINUTES: 60
      SMP_MODE: live
      SMP_STAFF_MODE: mock
      # Inside Compose, localhost means this container. Use the SMT service name;
      # the same API remains available to the host at http://localhost:9443.
      SMP_BASE_URL: http://smt-api:9443/api/v1
      SMP_SERVICE_TOKEN: local-integration-token
      SMP_WEBHOOK_SECRET: local-webhook-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      EMAIL_MODE: file
      EMAIL_OUTBOX_DIR: /app/data/mail
      EMAIL_RETRY_ENABLED: "false"
      IMAGE_LOCAL_DIR: /app/data/uploads
    ports:
      - "8443:8443"
    depends_on:
      smt-api:
        condition: service_healthy
      mongo-north:
        condition: service_healthy
      mongo-south:
        condition: service_healthy
    volumes:
      - sbp-storage-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8443'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sbp-web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8443/api/v1
        VITE_WS_URL: http://localhost:8443/ws
    ports:
      - "3000:80"
    depends_on:
      sbp-api:
        condition: service_healthy

volumes:
  smt-postgres-data:
  sbp-mongo-north-data:
  sbp-mongo-south-data:
  sbp-storage-data:
