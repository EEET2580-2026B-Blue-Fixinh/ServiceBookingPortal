# Req 5.S1: single-PC dev environment. Both shards point at the same local
# mongod instance (different database names), and SMP is mocked by default so
# SBP still runs standalone (Req 4.S2).
fixinh:
  sbp:
    smp:
      # Mock unless asked otherwise. This was a bare "mock" while there was no
      # SMP to reach; now that Team SMT's service runs on 9443, SMP_MODE=live
      # has to be able to reach this profile -- dev is the default profile, so
      # a hardcoded value here silently overrode the env var everywhere.
      mode: ${SMP_MODE:mock}
    email:
      # Stated explicitly rather than inherited. The acceptance criterion for
      # Req 3.1.S5 is that the dev profile sends nothing externally, and a rule
      # that important should be visible in the profile it applies to instead of
      # depending on a default two files away staying what it is.
      mode: file

server:
  ssl:
    enabled: false

logging:
  level:
    com.fixinh.sbp: DEBUG
    org.mongodb.driver.client: WARN
    org.mongodb.driver.cluster: WARN
