spring:
  application:
    name: sbp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:sbp}

# App-specific config, namespaced under fixinh.sbp and bound to typed
# @ConfigurationProperties classes in common/config. Keep secrets out of
# git: every value here falls back to an env var with a dev-only default.
fixinh:
  sbp:
    jwt:
      # Req 3.2.M1-M3: JWT issuance/validation for protected resources.
      secret: ${JWT_SECRET:dev-only-change-me-please-32-bytes-minimum-secret}
      issuer: ${JWT_ISSUER:fixinh-sbp}
      # Shorten this to test the client's forced sign-out without waiting an hour:
      # JWT_ACCESS_TOKEN_TTL_MINUTES=1. Also what /auth/login reports as expiresIn.
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:1}

    mongo:
      # Req 3.1.U1/U2, 4.U1: Customer data is horizontally sharded by region.
      # Boundary: Hue and south -> south shard; Quang Tri and north -> north shard.
      south:
        uri: ${MONGO_URI_SOUTH:mongodb://localhost:27017/sbp_south}
      north:
        uri: ${MONGO_URI_NORTH:mongodb://localhost:27017/sbp_north}

    smp:
      # Req 4.S2/4.M1/4.M3: Booking/Technician/Staff data is normally owned by
      # SMP. "mock" serves local JSON fixtures so SBP can run standalone;
      # "live" calls the real SMP REST API. Switched per environment below.
      mode: ${SMP_MODE:mock}
      base-url: ${SMP_BASE_URL:http://localhost:8081/api}
      webhook-shared-secret: ${SMP_WEBHOOK_SECRET:dev-only-shared-secret}

    cors:
      # Req A.2.6: restrictive CORS, no wildcard origins.
      # Port 3000 is fixed by the API contract (Section 2.1) and by the frontend's own
      # vite.config.js — it is the only origin this policy admits.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:3000,http://localhost:3000}

    cloudinary:
      # Req 3.3.M1, 3.4.M1: images are relayed through the backend, never
      # uploaded directly from the browser to Cloudinary.
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}

    google-oauth:
      # Req 3.2.U1-U3
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mongodb:
      enabled: false
      
