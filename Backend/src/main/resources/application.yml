spring:
  application:
    name: sbp
  config:
    # Local secrets live in Backend/.env (gitignored; copy .env.example). Optional, so a
    # machine without one still starts, and a variable exported in the shell still wins.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # Req 3.1.S5: integration always sends real email, so it brings the smtp
    # profile, which holds the provider settings. A group rather than a copy, so
    # the transport is written down in exactly one file. On a development machine,
    # opt in explicitly instead: SPRING_PROFILES_ACTIVE=dev,smtp.
    group:
      integration: smtp
  data:
    mongodb:
      # Disable auto-index creation when using MongoDB Atlas with existing indexes
      auto-index-creation: false

  servlet:
    multipart:
      # Req 3.3.M1, 3.4.M1: up to three evidence images of 5 MB each (API Doc §7.4, §8.1).
      # max-file-size is a backstop, not the rule -- BookingCancelValidator rejects an
      # oversized image with 413 FILE_TOO_LARGE and its own message, which this cannot do.
      # max-request-size allows the three files plus the text parts around them.
      # Above 5 MB on purpose: the validator must be the one that answers, so an oversized
      # image gets 413 with a message naming the real limit instead of a container-level
      # rejection. GlobalExceptionHandler still maps a breach of this cap to 413.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:8MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:26MB}

  mail:
    # Req 3.1.S5: socket timeouts for the welcome email's SMTP transport, in ms.
    #
    # Here rather than in application-smtp.yml because they are not secrets and
    # belong to every run that can send, whichever profiles brought it the
    # transport. Jakarta Mail waits forever by
    # default, so without these one unresponsive provider pins an administrator's
    # create-staff request, and the retry sweeper's thread, until a restart.
    #
    # They also bound how long a first send can take, which the retry sweeper's
    # grace for never-attempted rows (fixinh.sbp.email.retry.base-delay) relies on.
    #
    # Inert until spring.mail.host is set: with no host Spring Boot creates no mail
    # sender and nothing reads these. The smtp profile adds auth and STARTTLS to
    # this same map, and Spring Boot merges the two.
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:sbp}

# App-specific config, namespaced under fixinh.sbp and bound to typed
# @ConfigurationProperties classes in common/config. Keep secrets out of
# git: every value here falls back to an env var with a dev-only default.
fixinh:
  sbp:
    jwt:
      # Req 3.2.M1-M3: JWT issuance/validation for protected resources.
      secret: ${JWT_SECRET:dev-only-change-me-please-32-bytes-minimum-secret}
      issuer: ${JWT_ISSUER:fixinh-sbp}
      # Shorten this to test the client's forced sign-out without waiting an hour:
      # JWT_ACCESS_TOKEN_TTL_MINUTES=1. Also what /auth/login reports as expiresIn.
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:60}
      # How long a refresh token is honoured before /auth/refresh must be re-authenticated.
      refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

    mongo:
      # Req 3.1.U1/U2, 4.U1: Customer data is horizontally sharded by region.
      # Boundary: Hue and south -> south shard; Quang Tri and north -> north shard.
      south:
        uri: ${MONGO_URI_SOUTH}
      north:
        uri: ${MONGO_URI_NORTH}
      server-selection-timeout-seconds: ${MONGO_SERVER_SELECTION_TIMEOUT_SECONDS:30}

    smp:
      # Req 4.S2/4.M1/4.M3: Booking/Technician/Staff data is normally owned by
      # SMP. "mock" serves local JSON fixtures so SBP can run standalone;
      # "live" calls the real SMP REST API. Switched per environment below.
      mode: ${SMP_MODE:mock}
      # Staff follow their own switch, not mode above. SMT's service serves bookings
      # but has no staff API yet (API Doc section 12.8 is still provisional), so staff
      # stay on the mock even when bookings go live -- otherwise creating a receptionist
      # or technician, and the welcome email that follows (Req 3.1.S5), fails outright
      # the moment SBP talks to the real SMP. Set to live once SMT ships staff endpoints.
      staff-mode: ${SMP_STAFF_MODE:mock}
      # Team SMT's service listens on 9443 and mounts everything under /api/v1
      # (their README, "API contract"). In "live" mode this is only partly live:
      # the catalogue and booking creation are real HTTP calls, cancellation is
      # still answered inside SBP because SMT publishes no endpoint for it --
      # see LocalCancellationRule for what that costs.
      base-url: ${SMP_BASE_URL:http://localhost:9443/api/v1}
      # The bearer token SMT expects on every call. Their development default;
      # a real one belongs in the environment, never in this file.
      service-token: ${SMP_SERVICE_TOKEN:local-integration-token}
      # The mirror image: the bearer SMP presents on every call to /integration (Req 4.M2,
      # API Doc §11.1), checked by IntegrationAuthenticationFilter with a constant-time
      # compare. Blank refuses every integration call rather than admitting them all. The
      # default is for a single-PC dev setup; the real value belongs in the environment.
      webhook-shared-secret: ${SMP_WEBHOOK_SECRET:dev-only-shared-secret}

    cors:
      # Req A.2.6: restrictive CORS, no wildcard origins.
      # Port 3000 is fixed by the API contract (Section 2.1) and by the frontend's own
      # vite.config.js — it is the only origin this policy admits.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:3000,http://localhost:3000}

    email:
      # Req 3.1.S5, API Doc §10.6: the welcome email sent when an administrator
      # creates a receptionist or technician.
      #
      # This block is policy. The SMTP host and credential live under spring.mail.*
      # and are set only by application-smtp.yml -- there is deliberately no
      # spring.mail.host here, because a default of localhost would let a
      # misconfigured environment appear to send while dropping every message.
      # The socket timeouts are the one exception; see spring.mail above.
      #
      # mode: file -> EmailClient writes the message to outbox-directory and
      #               nothing leaves the machine. The default everywhere, so
      #               sending is opted into rather than fallen into.
      #       smtp -> EmailClient sends through spring.mail.*. Set by the smtp
      #               profile, not by hand: that profile also brings the transport.
      mode: ${EMAIL_MODE:file}
      from-address: ${EMAIL_FROM_ADDRESS:no-reply@fixinh.vn}
      from-name: ${EMAIL_FROM_NAME:Fixinh}
      # Under target/ on purpose: .gitignore already covers it, and mvn clean
      # discards messages containing an initial password.
      outbox-directory: ${EMAIL_OUTBOX_DIR:target/mail}
      # NOTE: this is SMP's sign-in page, not SBP's. Staff accounts live in SMP
      # and cannot sign in to SBP. Placeholder until SMT publishes the real URL,
      # exactly as smp.base-url above is a placeholder.
      staff-sign-in-url: ${EMAIL_STAFF_SIGN_IN_URL:http://localhost:8081/login}

      retry:
        # a welcome email the provider refused is retried in the background.
        # This is what makes §10.6's 502 honest -- the request fails, the account stands,
        # and the message is still owed.
        #
        # enabled and sweep-interval are read by @ConditionalOnProperty and @Scheduled,
        # which resolve placeholders before binding and so cannot see SbpProperties. The
        # three below are bound normally. Durations are ISO-8601 (PT1M, PT30S, PT2M).
        enabled: ${EMAIL_RETRY_ENABLED:true}
        sweep-interval: ${EMAIL_RETRY_SWEEP_INTERVAL:PT1M}
        initial-delay: ${EMAIL_RETRY_INITIAL_DELAY:PT30S}
        # Attempts in total, the first included. On the last failure the notification is
        # marked ABANDONED rather than retried forever.
        max-attempts: ${EMAIL_RETRY_MAX_ATTEMPTS:5}
        # Doubles each time: with 2 minutes, attempts land at about 0, 2, 6, 14 and 30.
        # Also the grace a never-attempted row gets before the sweeper assumes the
        # request that wrote it has died -- keep it well above the SMTP timeouts
        # under spring.mail, or a slow first send can be sent a second time.
        base-delay: ${EMAIL_RETRY_BASE_DELAY:PT2M}
        batch-size: ${EMAIL_RETRY_BATCH_SIZE:50}

    images:
      # Req 3.3.M1, 3.4.M1, API Doc §7.4: evidence images on a cancellation or a rating.
      #
      # Same split as email above: this block is policy, the account credential is below.
      #
      # mode: local      -> ImageStorageService writes under local-directory and nothing
      #                     leaves the machine. The default, so publishing customer
      #                     photographs is opted into rather than fallen into, and so the
      #                     cancellation flow works with no Cloudinary account at all.
      #       cloudinary -> uploaded to the account below; the returned URLs are public.
      #
      # Point local-directory somewhere unwritable to exercise §7.4's 502 UPLOAD_FAILED.
      mode: ${IMAGE_STORAGE_MODE:local}
      # Under target/ for the same reason the mail outbox is: .gitignore covers it and
      # mvn clean discards the images instead of leaving them in the working tree.
      local-directory: ${IMAGE_LOCAL_DIR:target/uploads}

    cloudinary:
      # Read only when images.mode is cloudinary. Images are relayed through the backend,
      # never uploaded directly from the browser, so the secret stays on this side.
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}

    oauth:
      google:
        # Req 3.2.U1-U3: Google OAuth 2.0 Sign-In
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/login}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mongodb:
      enabled: false