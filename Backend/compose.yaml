# Local MongoDB for development (Req 5.S1: single-PC dev environment).
#
# One mongod holds both regional stores as separate databases — sbp_south and
# sbp_north — which is exactly what application-dev.yml points at. They are
# logically separate shards; running them in one instance is a dev convenience,
# not a design decision.
#
#   docker compose up -d      start
#   docker compose down       stop, keeping data
#   docker compose down -v    stop and wipe the data volume
services:
  mongo:
    image: mongo:8
    container_name: sbp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sbp-mongo-data:/data/db
    healthcheck:
      # The app creates indexes on startup, so it must not connect before mongod
      # is actually accepting queries.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sbp-mongo-data:
