server:
  port: ${MOCKSMP_PORT:8090}

mocksmp:
  # SBP sends this as "Authorization: Bearer <token>" on every call (SMP_STAFF_SERVICE_TOKEN
  # on SBP's side, per Backend/src/main/resources/application.yml). Blank refuses every
  # request rather than accepting an unauthenticated one.
  service-token: ${SMP_SERVICE_TOKEN:dev-only-shared-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
